version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://nerlogistics:nerlogistics@db:5432/nerlogistics
      - SECRET_KEY=ner-logistics-production-secret-key
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: nerlogistics
      POSTGRES_USER: nerlogistics
      POSTGRES_PASSWORD: nerlogistics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nerlogistics"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
