<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NER Logistics Intelligence Platform | MDoNER</title>
  <meta name="description"
    content="AI-powered logistics intelligence for India's North Eastern Region — Ministry of Development of North Eastern Region" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.min.js"></script>

  <style>
    :root {
      --bg-primary: #0a0e1a;
      --bg-secondary: #0f1629;
      --bg-card: #151d35;
      --bg-card-hover: #1c2642;
      --border: #1e2d4a;
      --border-light: #263552;
      --text-primary: #e8eef7;
      --text-secondary: #8fa3c8;
      --text-muted: #4d6080;
      --accent-blue: #3b82f6;
      --accent-blue-light: #60a5fa;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-yellow: #f59e0b;
      --accent-red: #ef4444;
      --accent-purple: #8b5cf6;
      --accent-orange: #f97316;
      --gradient-primary: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #2563eb 100%);
      --gradient-card: linear-gradient(135deg, #151d35 0%, #1a2440 100%);
      --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);
      --shadow-glow: 0 0 30px rgba(59, 130, 246, 0.15);
      --radius: 12px;
      --radius-sm: 8px;
      --sidebar-w: 240px;
      --topbar-h: 64px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
    }

    /* SCROLLBAR */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-secondary);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-light);
      border-radius: 3px;
    }

    /* BUTTON SYSTEM */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--accent-blue);
      color: white;
    }

    .btn-primary:hover {
      background: #2563eb;
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(59, 130, 246, 0.35);
    }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--accent-blue);
      background: var(--bg-card-hover);
    }

    .btn-success {
      background: var(--accent-green);
      color: white;
    }

    .btn-success:hover {
      background: #059669;
      transform: translateY(-1px);
    }

    .btn-danger {
      background: var(--accent-red);
      color: white;
    }

    .btn-outline {
      background: transparent;
      color: var(--accent-blue);
      border: 1px solid var(--accent-blue);
    }

    .btn-outline:hover {
      background: rgba(59, 130, 246, 0.1);
    }

    .btn-lg {
      padding: 14px 28px;
      font-size: 16px;
      border-radius: var(--radius);
    }

    .btn-sm {
      padding: 6px 14px;
      font-size: 12px;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* BADGES */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-critical {
      background: rgba(239, 68, 68, 0.15);
      color: var(--accent-red);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .badge-high {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-yellow);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .badge-medium {
      background: rgba(6, 182, 212, 0.15);
      color: var(--accent-cyan);
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    .badge-low {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-info {
      background: rgba(139, 92, 246, 0.15);
      color: var(--accent-purple);
      border: 1px solid rgba(139, 92, 246, 0.3);
    }

    .badge-recommended {
      background: rgba(59, 130, 246, 0.2);
      color: var(--accent-blue-light);
      border: 1px solid rgba(59, 130, 246, 0.4);
    }

    .badge-active {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-limited {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-yellow);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    /* CARDS */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      border-color: var(--border-light);
    }

    .card-glow:hover {
      box-shadow: var(--shadow-glow);
    }

    /* FORM ELEMENTS */
    select,
    input[type=text],
    input[type=email],
    input[type=password],
    input[type=number],
    textarea {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus,
    input:focus,
    textarea:focus {
      border-color: var(--accent-blue);
    }

    select option {
      background: var(--bg-secondary);
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    /* PROGRESS */
    .progress-bar {
      background: var(--bg-secondary);
      border-radius: 4px;
      height: 8px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.5s;
    }

    /* GAUGE */
    .gauge-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .gauge-text {
      font-size: 28px;
      font-weight: 800;
      color: var(--text-primary);
      margin-top: -20px;
    }

    .gauge-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* LAYOUT */
    #app {
      min-height: 100vh;
    }

    /* AUTH PAGES */
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
    }

    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-lg);
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .auth-logo img {
      width: 60px;
      height: 60px;
    }

    .auth-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-primary);
      text-align: center;
    }

    .auth-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      text-align: center;
      margin-top: 6px;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-top: 28px;
    }

    .auth-demo-badge {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 12px;
      color: var(--accent-green);
      margin-bottom: 16px;
    }

    /* LANDING PAGE */
    .landing {
      background: var(--bg-primary);
    }

    .landing-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      position: sticky;
      top: 0;
      background: rgba(10, 14, 26, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
    }

    .landing-hero {
      padding: 80px 40px;
      text-align: center;
      background: radial-gradient(ellipse at 50% 0%, rgba(30, 58, 138, 0.4) 0%, transparent 60%);
    }

    .landing-hero h1 {
      font-size: 52px;
      font-weight: 800;
      line-height: 1.15;
      max-width: 800px;
      margin: 0 auto;
      background: linear-gradient(135deg, #e8eef7 30%, #60a5fa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .landing-hero p {
      font-size: 18px;
      color: var(--text-secondary);
      max-width: 600px;
      margin: 20px auto;
    }

    .landing-btns {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-top: 36px;
      flex-wrap: wrap;
    }

    .landing-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      max-width: 1000px;
      margin: 60px auto;
      padding: 0 40px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
    }

    .stat-number {
      font-size: 36px;
      font-weight: 800;
      color: var(--accent-blue);
    }

    .stat-label {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 6px;
    }

    .landing-features {
      padding: 60px 40px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .landing-features h2 {
      font-size: 32px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 48px;
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .feature-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      transition: all 0.3s;
    }

    .feature-card:hover {
      border-color: var(--accent-blue);
      transform: translateY(-4px);
      box-shadow: var(--shadow-glow);
    }

    .feature-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-sm);
      background: rgba(59, 130, 246, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .feature-card h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .feature-card p {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .landing-footer {
      border-top: 1px solid var(--border);
      padding: 32px 40px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* DASHBOARD LAYOUT */
    .dashboard-layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: var(--sidebar-w);
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 200;
      transition: transform 0.3s;
    }

    .sidebar-logo {
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-logo-text {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-blue);
    }

    .sidebar-logo-sub {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .nav-section {
      padding: 16px 0;
    }

    .nav-section-label {
      padding: 4px 16px;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      border-left: 3px solid transparent;
    }

    .nav-item:hover {
      color: var(--text-primary);
      background: rgba(59, 130, 246, 0.05);
    }

    .nav-item.active {
      color: var(--accent-blue-light);
      background: rgba(59, 130, 246, 0.1);
      border-left-color: var(--accent-blue);
    }

    .nav-item svg {
      flex-shrink: 0;
    }

    .sidebar-bottom {
      margin-top: auto;
      padding: 16px;
      border-top: 1px solid var(--border);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--gradient-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .user-name {
      font-size: 13px;
      font-weight: 600;
    }

    .user-role {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* TOPBAR */
    .topbar {
      height: var(--topbar-h);
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-search {
      flex: 1;
      max-width: 400px;
      position: relative;
    }

    .topbar-search input {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      padding-left: 38px;
    }

    .topbar-search .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .search-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      z-index: 1000;
      max-height: 300px;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
    }

    .search-item {
      padding: 10px 14px;
      cursor: pointer;
      transition: background 0.2s;
      border-bottom: 1px solid var(--border);
    }

    .search-item:last-child {
      border-bottom: none;
    }

    .search-item:hover {
      background: var(--bg-card-hover);
    }

    .search-item-name {
      font-size: 13px;
      font-weight: 500;
    }

    .search-item-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      transition: all 0.2s;
      position: relative;
    }

    .icon-btn:hover {
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    .notif-dot {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-red);
      border: 2px solid var(--bg-secondary);
    }

    .system-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--accent-green);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    /* MAIN CONTENT */
    .main-content {
      margin-left: var(--sidebar-w);
      padding-top: var(--topbar-h);
      min-height: 100vh;
      width: calc(100vw - var(--sidebar-w));
      max-width: calc(100vw - var(--sidebar-w));
      flex: 1 1 0%;
      min-width: 0;
    }

    .page-content {
      padding: 24px;
      width: 100%;
    }

    .page-header {
      margin-bottom: 24px;
    }

    .page-title {
      font-size: 24px;
      font-weight: 800;
    }

    .page-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* KPI CARDS */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .kpi-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .kpi-value {
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
    }

    .kpi-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .kpi-change {
      font-size: 11px;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .kpi-up {
      color: var(--accent-green);
    }

    .kpi-down {
      color: var(--accent-red);
    }

    /* ROUTE PLANNER */
    .route-layout {
      display: grid;
      grid-template-columns: 380px minmax(0, 1fr);
      gap: 20px;
      height: calc(100vh - var(--topbar-h) - 80px);
      min-height: 600px;
      width: 100%;
    }

    .route-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      min-width: 0;
    }

    .route-form {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .route-cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .route-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .route-card:hover {
      border-color: var(--accent-blue);
    }

    .route-card.selected {
      border-color: var(--accent-blue);
      background: rgba(59, 130, 246, 0.05);
    }

    .route-card.recommended {
      border-color: var(--accent-green);
    }

    .route-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .route-name {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
    }

    .route-score {
      font-size: 22px;
      font-weight: 800;
      color: var(--accent-blue);
    }

    .route-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .metric-item {
      text-align: center;
    }

    .metric-value {
      font-size: 14px;
      font-weight: 700;
    }

    .metric-label {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .map-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 500px;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    #main-map {
      width: 100% !important;
      height: 100% !important;
      min-height: 500px;
      flex: 1;
    }

    .map-legend {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(15, 22, 41, 0.95);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      z-index: 1000;
      font-size: 11px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-line {

    .weight-fill {

    .weight-pct {

      font-weight: 700;

    /* MAP */
    .leaflet-popup-content-wrapper {
      background: var(--bg-card) !important;
      color: var(--text-primary) !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius-sm) !important;
    }

    .leaflet-popup-tip {
      background: var(--bg-card) !important;
    }

    .leaflet-popup-content {
      font-family: 'Inter', sans-serif !important;
      font-size: 13px !important;
    }

    .popup-title {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .popup-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      color: var(--text-secondary);
      padding: 2px 0;
    }

    /* HUBS PAGE */
    .hubs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .hub-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      cursor: pointer;
      transition: all 0.2s;

    .hub-card:hover {

      transform: translateY(-2px);
    }

    .hub-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .hub-name {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.3;
    }

    .hub-location {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .connectivity-bars {

      margin-top: 16px;

      margin-bottom: 4px;
    }

    .conn-value {

    .modal-body {

      margin-top: 12px;

      color: var(--accent-blue-light);

      font-weight: 700;

      height: 18px;

      top: 3px;
      left: 3px;
      transition: transform 0.2s;

    .toggle.on::after {

    /* ACCESSIBILITY MAP */
    .accessibility-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
    }

    .state-bars {
      display: flex;

    .state-bar-item {
      display: flex;
      align-items: center;
      gap: 12px;

    .state-score {

    /* LOADING / ERROR */

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px;
      text-align: center;
      gap: 12px;

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px;
      text-align: center;
      gap: 12px;
      color: var(--text-muted);
    }

    /* DEMO BANNER */
    .demo-banner {
      background: rgba(245, 158, 11, 0.1);
      border-bottom: 1px solid rgba(245, 158, 11, 0.3);
      padding: 8px 24px;
      font-size: 12px;
      color: var(--accent-yellow);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* RESPONSIVE */
    .hamburger {
      display: none;
    }

    @media (max-width: 900px) {
      .sidebar {
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main-content {
        margin-left: 0;
      }

      .hamburger {
        display: flex;
      }

      .route-layout {
        grid-template-columns: 1fr;
      }

      .analytics-grid {
        grid-template-columns: 1fr;
      }

      .insights-grid {
        grid-template-columns: 1fr;
      }

      .features-grid {
        grid-template-columns: 1fr;
      }

      .landing-stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .landing-hero h1 {
        font-size: 32px;
      }

      .settings-grid {
        grid-template-columns: 1fr;
      }

      .accessibility-layout {
        grid-template-columns: 1fr;
      }

      .hubs-grid {
        grid-template-columns: 1fr;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .kpi-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Overlay for mobile sidebar */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 150;
    }

    .sidebar-overlay.show {
      display: block;
    }

    /* Data source badge */
    .data-source {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 11px;
      color: var(--accent-yellow);
      margin-left: 12px;
    }
  </style>
</head>

<body>
  <div id="app">
    <!-- Loading state while app initializes -->
    <div id="init-loading"

  <!-- React and dependencies via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <script>
    // ============================================================
    // NER LOGISTICS INTELLIGENCE PLATFORM - FRONTEND APPLICATION
    // ============================================================
    const { useState, useEffect, useRef, useCallback, useMemo, createContext, useContext } = React;

    const API_BASE = 'http://localhost:8000';

    // ============================================================
    // API SERVICE
    // ============================================================
    const api = {
      token: null,

      setToken(t) { this.token = t; if (t) localStorage.setItem('ner_token', t); else localStorage.removeItem('ner_token'); },
      loadToken() { this.token = localStorage.getItem('ner_token'); },

      async request(path, opts = {}) {
        const headers = { 'Content-Type': 'application/json', ...(this.token ? { Authorization: `Bearer ${this.token}` } : {}) };
        const res = await fetch(API_BASE + path, { ...opts, headers: { ...headers, ...opts.headers } });
        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: 'Request failed' }));
          throw new Error(err.detail || 'Request failed');
        }
        return res.json();
      },

      login: (email, password) => api.request('/api/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) }),
      register: (email, full_name, password) => api.request('/api/auth/register', { method: 'POST', body: JSON.stringify({ email, full_name, password }) }),
      getMe: () => api.request('/api/auth/me'),
      updateMe: (data) => api.request('/api/auth/me', { method: 'PUT', body: JSON.stringify(data) }),

      getStates: () => api.request('/api/states'),
      getCities: (params = {}) => api.request('/api/cities?' + new URLSearchParams(params)),

      getRoutes: (params = {}) => api.request('/api/routes?' + new URLSearchParams(params)),
      optimizeRoute: (data) => api.request('/api/routes/optimize', { method: 'POST', body: JSON.stringify(data) }),

      getHubs: (params = {}) => api.request('/api/hubs?' + new URLSearchParams(params)),
      getHub: (id) => api.request(`/api/hubs/${id}`),

      getAlerts: (params = {}) => api.request('/api/alerts?' + new URLSearchParams(params)),

      getAnalytics: (params = {}) => api.request('/api/analytics/accessibility?' + new URLSearchParams(params)),
      getRouteAnalytics: () => api.request('/api/analytics/routes'),

      getInsights: () => api.request('/api/insights'),
      getKPIs: () => api.request('/api/dashboard/kpis'),

      search: (q) => api.request('/api/search?q=' + encodeURIComponent(q)),
      submitFeedback: (data) => api.request('/api/feedback', { method: 'POST', body: JSON.stringify(data) }),
    };
    api.loadToken();

    // ============================================================
    // AUTH CONTEXT
    // ============================================================
    const AuthContext = createContext(null);

    function AuthProvider({ children }) {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        if (api.token) {
          api.getMe().then(u => { setUser(u); setLoading(false); }).catch(() => { api.setToken(null); setLoading(false); });
        } else { setLoading(false); }
      }, []);

      const login = async (email, password) => {
        const res = await api.login(email, password);
        api.setToken(res.access_token);
        const u = await api.getMe();
        setUser(u);
        return u;
      };

      const logout = () => { api.setToken(null); setUser(null); };

      return React.createElement(AuthContext.Provider, { value: { user, setUser, login, logout, loading } }, children);
    }

    const useAuth = () => useContext(AuthContext);

    // ============================================================
    // NAVIGATION CONTEXT
    // ============================================================
    const NavContext = createContext(null);

    function NavProvider({ children }) {
      const [page, setPage] = useState('landing');
      const [sidebarOpen, setSidebarOpen] = useState(false);

      const navigate = (p) => { setPage(p); setSidebarOpen(false); window.scrollTo(0, 0); };

      return React.createElement(NavContext.Provider, { value: { page, navigate, sidebarOpen, setSidebarOpen } }, children);
    }

    const useNav = () => useContext(NavContext);

    // ============================================================
    // UTILITY COMPONENTS
    // ============================================================
    function Spinner({ size = 40 }) {
      return React.createElement('div', { style: { display: 'flex', justifyContent: 'center', alignItems: 'center', padding: '60px' } },
        React.createElement('div', { className: 'spinner', style: { width: size, height: size } })
      );
    }

    function ErrorState({ message, onRetry }) {
      return React.createElement('div', { className: 'error-state' },
        React.createElement('div', { style: { color: 'var(--accent-red)', fontSize: 32 } }, '⚠'),
        React.createElement('div', { style: { fontWeight: 600 } }, 'Something went wrong'),
        React.createElement('div', { style: { color: 'var(--text-secondary)', fontSize: 14 } }, message || 'Failed to load data'),
        onRetry && React.createElement('button', { className: 'btn btn-secondary btn-sm', onClick: onRetry, style: { marginTop: 8 } }, 'Retry')
      );
    }

    function EmptyState({ message }) {
      return React.createElement('div', { className: 'empty-state' },
        React.createElement('div', { style: { fontSize: 40, marginBottom: 8 } }, '📭'),
        React.createElement('div', { style: { fontWeight: 600 } }, 'No data found'),
        React.createElement('div', { style: { fontSize: 13 } }, message || 'Try adjusting your search or filters')
      );
    }

    function Badge({ label, type }) {
      return React.createElement('span', { className: `badge badge-${type}` }, label);
    }

    function ProgressBar({ value, color = 'var(--accent-blue)', height = 8 }) {
      return React.createElement('div', { className: 'progress-bar', style: { height } },
        React.createElement('div', { className: 'progress-fill', style: { width: `${Math.min(100, Math.max(0, value))}%`, background: color } })
      );
    }

    // ============================================================
    // LANDING PAGE
    // ============================================================
    function LandingPage() {
      const { navigate } = useNav();

      const features = [
        { icon: '🗺️', title: 'AI Route Optimization', desc: 'Weighted multi-criteria scoring engine recommends optimal routes considering accessibility, risk, cost, and disruptions.' },
        { icon: '🌐', title: 'Interactive Map Intelligence', desc: 'Real-time Leaflet maps show routes, logistics hubs, airports, railways, and active alert zones across all 8 NE states.' },
        { icon: '⚡', title: 'Smart Accessibility Scoring', desc: 'Dynamic 0-100 scores for each state and route based on terrain, road quality, connectivity, and weather.' },
        { icon: '🚨', title: 'Live Alert System', desc: 'Flood, landslide, road closure, and border checkpoint alerts with severity classification and route impact.' },
        { icon: '📊', title: 'Analytics Dashboard', desc: 'Recharts-powered visualizations for state accessibility, delivery times, risk distribution, and monthly trends.' },
        { icon: '🤖', title: 'AI Insights Engine', desc: 'Deterministic analytics generate actionable insights from live data — no fake outputs, all data-driven.' },
      ];

      const stats = [
        { number: '8', label: 'NE States Covered' },
        { number: '17+', label: 'Cities Mapped' },
        { number: '16+', label: 'Routes Analysed' },
        { number: '8', label: 'Logistics Hubs' },
      ];

      return React.createElement('div', { className: 'landing' },
        React.createElement('nav', { className: 'landing-nav' },
          React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: 12 } },
            React.createElement('div', { style: { width: 40, height: 40, background: 'var(--gradient-primary)', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 18 } }, '🏔'),
            React.createElement('div', null,
              React.createElement('div', { style: { fontSize: 15, fontWeight: 800, color: 'var(--text-primary)' } }, 'NER Logistics Intelligence'),
              React.createElement('div', { style: { fontSize: 11, color: 'var(--text-muted)' } }, 'Ministry of Development of North Eastern Region')
            )
          ),
          React.createElement('div', { style: { display: 'flex', gap: 12 } },
            React.createElement('button', { className: 'btn btn-secondary btn-sm', onClick: () => navigate('login') }, 'Sign In'),
            React.createElement('button', { className: 'btn btn-primary btn-sm', onClick: () => navigate('dashboard') }, 'Open Dashboard')
          )
        ),

        React.createElement('div', { className: 'landing-hero' },
          React.createElement('div', { style: { display: 'inline-flex', alignItems: 'center', gap: 8, background: 'rgba(59,130,246,0.1)', border: '1px solid rgba(59,130,246,0.3)', borderRadius: 20, padding: '6px 16px', fontSize: 12, color: 'var(--accent-blue)', marginBottom: 24 } },
            '🏛️ MDoNER Hackathon 2024 • AI-Powered Infrastructure'
          ),
          React.createElement('h1', null, 'AI-Based Smart Logistics & Accessibility Intelligence for North Eastern India'),
          React.createElement('p', null, 'A unified platform for route optimization, accessibility analytics, disruption management, and logistics intelligence across all 8 North Eastern states.'),

    // ============================================================
    // LEAFLET MAP COMPONENT
    // ============================================================
    function MapView({ routes = [], selectedRouteId = null, hubs = [], alerts = [], origin = null, destination = null }) {
      const mapRef = useRef(null);
      const mapInstance = useRef(null);
      const layersRef = useRef([]);

      const NER_CENTER = [25.7, 92.5];
      const NER_ZOOM = 7;

      useEffect(() => {
        if (!mapRef.current) return;
        if (mapInstance.current) return;

        const map = L.map(mapRef.current).setView(NER_CENTER, NER_ZOOM);
        mapInstance.current = map;

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© OpenStreetMap contributors',
          maxZoom: 18
        }).addTo(map);

        const t1 = setTimeout(() => { try { map.invalidateSize(); } catch (e) { } }, 100);
        const t2 = setTimeout(() => { try { map.invalidateSize(); } catch (e) { } }, 400);

        const onResize = () => { try { map.invalidateSize(); } catch (e) { } };
        window.addEventListener('resize', onResize);

        return () => {
          clearTimeout(t1);
          clearTimeout(t2);
          window.removeEventListener('resize', onResize);
          if (mapInstance.current) { mapInstance.current.remove(); mapInstance.current = null; }
        };
      }, []);

      useEffect(() => {
        const map = mapInstance.current;
        if (!map) return;

        layersRef.current.forEach(l => { try { map.removeLayer(l); } catch (e) { } });
        layersRef.current = [];

        const addLayer = (l) => { l.addTo(map); layersRef.current.push(l); };

        // Draw routes with distinct mode-specific styling
        routes.forEach((route, idx) => {
          if (!route.waypoints_latlng || route.waypoints_latlng.length < 2) return;
          const isSelected = route.route_id === selectedRouteId;
          const isRecommended = route.is_recommended;
          const mode = (route.transport_mode || 'road').toLowerCase();

          // 1. RAIL ROUTE: Real railroad tracks pattern (dark solid line base + dashed amber railroad ties overlay)
          if (mode === 'rail') {
            const baseRail = L.polyline(route.waypoints_latlng, {
              color: '#0f172a',
              weight: isSelected ? 7 : (isRecommended ? 6 : 4),
              opacity: 0.9
            });
            const tieRail = L.polyline(route.waypoints_latlng, {
              color: isSelected ? '#a855f7' : (isRecommended ? '#f59e0b' : '#cbd5e1'),
              weight: isSelected ? 4 : (isRecommended ? 3 : 2),
              opacity: 1,
              dashArray: '8, 8'
            });
            const popupHtml = `
              <div class="popup-title">🚆 ${route.route_name}</div>
              <div class="popup-row"><span>Type</span><strong style="color:#f59e0b">Rail Freight Corridor</strong></div>
              <div class="popup-row"><span>Distance</span><strong>${route.distance_km} km</strong></div>
              <div class="popup-row"><span>Travel Time</span><strong>${route.travel_time_hours}h</strong></div>
              <div class="popup-row"><span>Cost</span><strong>₹${(route.cost_inr/1000).toFixed(1)}K</strong></div>
              <div class="popup-row"><span>AI Score</span><strong>${route.overall_score}/100</strong></div>
              ${isRecommended ? '<div style="margin-top:8px;padding:4px 8px;background:rgba(245,158,11,0.2);border-radius:4px;font-size:11px;color:#f59e0b;font-weight:700;">⭐ AI RECOMMENDED (BULK FREIGHT)</div>' : ''}
            `;
            baseRail.bindPopup(popupHtml);
            tieRail.bindPopup(popupHtml);
            addLayer(baseRail);
            addLayer(tieRail);

            // Add Train Icon marker at midpoint
            const midPt = route.waypoints_latlng[Math.floor(route.waypoints_latlng.length / 2)];
            const trainIcon = L.divIcon({
              html: `<div style="background:#f59e0b;color:black;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13px;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.5)">🚆</div>`,
              className: '', iconSize: [26, 26], iconAnchor: [13, 13]
            });
            const trainMarker = L.marker(midPt, { icon: trainIcon });
            trainMarker.bindPopup(popupHtml);
            addLayer(trainMarker);
          }
          // 2. AIR ROUTE: Curved sky-cyan dashed flight arc + Airplane icon
          else if (mode === 'air') {
            const airColor = isSelected ? '#c084fc' : (isRecommended ? '#06b6d4' : '#38bdf8');
            const airLine = L.polyline(route.waypoints_latlng, {
              color: airColor,
              weight: isSelected ? 5 : (isRecommended ? 4 : 3),
              opacity: 0.95,
              dashArray: '10, 8'
            });
            const popupHtml = `
              <div class="popup-title">✈️ ${route.route_name}</div>
              <div class="popup-row"><span>Type</span><strong style="color:#06b6d4">Great-Circle Air Freight Arc</strong></div>
              <div class="popup-row"><span>Flight Distance</span><strong>${route.distance_km} km</strong></div>
              <div class="popup-row"><span>Transit Time</span><strong>${route.travel_time_hours}h (Fastest)</strong></div>
              <div class="popup-row"><span>Terrain / Landslide Risk</span><strong style="color:#10b981">0% (Air Corridor)</strong></div>
              <div class="popup-row"><span>AI Score</span><strong>${route.overall_score}/100</strong></div>
              ${isRecommended ? '<div style="margin-top:8px;padding:4px 8px;background:rgba(6,182,212,0.2);border-radius:4px;font-size:11px;color:#06b6d4;font-weight:700;">⭐ AI RECOMMENDED (EXPRESS AIR)</div>' : ''}
            `;
            airLine.bindPopup(popupHtml);
            addLayer(airLine);

            // Add Airplane Icon marker at flight arc apex
            const apexPt = route.waypoints_latlng[Math.floor(route.waypoints_latlng.length / 2)];
            const planeIcon = L.divIcon({
              html: `<div style="background:#06b6d4;color:white;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:15px;border:2px solid white;box-shadow:0 2px 8px rgba(6,182,212,0.6)">✈️</div>`,
              className: '', iconSize: [28, 28], iconAnchor: [14, 14]
            });
            const planeMarker = L.marker(apexPt, { icon: planeIcon });
            planeMarker.bindPopup(popupHtml);
            addLayer(planeMarker);
          }
          // 3. MULTIMODAL ROUTE: Pink/Magenta dashed line with transit hub
          else if (mode === 'multimodal') {
            const multiColor = isSelected ? '#a855f7' : (isRecommended ? '#ec4899' : '#f472b6');
            const multiLine = L.polyline(route.waypoints_latlng, {
              color: multiColor,
              weight: isSelected ? 5 : (isRecommended ? 4 : 3),
              opacity: 0.9,
              dashArray: '14, 6'
            });
            const popupHtml = `
              <div class="popup-title">🔀 ${route.route_name}</div>
              <div class="popup-row"><span>Type</span><strong style="color:#ec4899">Multimodal (Rail Trunk + Highway Feeder)</strong></div>
              <div class="popup-row"><span>Total Distance</span><strong>${route.distance_km} km</strong></div>
              <div class="popup-row"><span>Est. Travel Time</span><strong>${route.travel_time_hours}h</strong></div>
              <div class="popup-row"><span>AI Score</span><strong>${route.overall_score}/100</strong></div>
              ${isRecommended ? '<div style="margin-top:8px;padding:4px 8px;background:rgba(236,72,153,0.2);border-radius:4px;font-size:11px;color:#ec4899;font-weight:700;">⭐ AI RECOMMENDED (OPTIMAL MULTIMODAL)</div>' : ''}
            `;
            multiLine.bindPopup(popupHtml);
            addLayer(multiLine);

            // Transfer hub marker at midpoint
            const hubPt = route.waypoints_latlng[Math.floor(route.waypoints_latlng.length / 2)];
            const transferIcon = L.divIcon({
              html: `<div style="background:#ec4899;color:white;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13px;border:2px solid white;box-shadow:0 2px 8px rgba(236,72,153,0.6)">🔄</div>`,
              className: '', iconSize: [26, 26], iconAnchor: [13, 13]
            });
            const transferMarker = L.marker(hubPt, { icon: transferIcon });
            transferMarker.bindPopup(`<div class="popup-title">🔄 Multimodal Transfer Hub</div><div class="popup-row">Rail-to-Truck transshipment terminal</div>`);
            addLayer(transferMarker);
          }
          // 4. ROAD / HIGHWAY ROUTE: Exact turn-by-turn road curves
          else {
            const roadColor = isSelected ? '#8b5cf6' : (isRecommended ? '#3b82f6' : '#10b981');
            const roadLine = L.polyline(route.waypoints_latlng, {
              color: roadColor,
              weight: isSelected ? 6 : (isRecommended ? 5 : 3),
              opacity: isSelected ? 1 : 0.85
            });
            const popupHtml = `
              <div class="popup-title">🚛 ${route.route_name}</div>
              <div class="popup-row"><span>Type</span><strong>Exact Road Network (Turn-by-Turn)</strong></div>
              <div class="popup-row"><span>Distance</span><strong>${route.distance_km} km</strong></div>
              <div class="popup-row"><span>Travel Time</span><strong>${route.travel_time_hours}h</strong></div>
              <div class="popup-row"><span>Cost</span><strong>₹${(route.cost_inr/1000).toFixed(1)}K</strong></div>
              <div class="popup-row"><span>Road Quality</span><strong>${route.road_quality_score}/100</strong></div>
              <div class="popup-row"><span>AI Score</span><strong>${route.overall_score}/100</strong></div>
              ${isRecommended ? '<div style="margin-top:8px;padding:4px 8px;background:rgba(59,130,246,0.2);border-radius:4px;font-size:11px;color:#60a5fa;font-weight:700;">⭐ AI RECOMMENDED ROAD ROUTE</div>' : ''}
            `;
            roadLine.bindPopup(popupHtml);
            addLayer(roadLine);

            // Truck icon marker
            if (route.waypoints_latlng.length > 5) {
              const truckPt = route.waypoints_latlng[Math.floor(route.waypoints_latlng.length * 0.35)];
              const truckIcon = L.divIcon({
                html: `<div style="background:${roadColor};color:white;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13px;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.4)">🚛</div>`,
                className: '', iconSize: [26, 26], iconAnchor: [13, 13]
              });
              const truckMarker = L.marker(truckPt, { icon: truckIcon });
              truckMarker.bindPopup(popupHtml);
              addLayer(truckMarker);
            }
          }
        });

        // Origin & destination markers
        const makeIcon = (emoji, color) => L.divIcon({
          html: `<div style="width:28px;height:28px;border-radius:50%;background:${color};display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.4)">${emoji}</div>`,
          className: '', iconSize: [28, 28], iconAnchor: [14, 14]
        });

        if (origin) {
          const m = L.marker([origin.lat, origin.lng], { icon: makeIcon('🟢', '#10b981') });
          m.bindPopup(`<div class="popup-title">Origin: ${origin.name}</div><div class="popup-row"><span>State</span><strong>${origin.state_name || ''}</strong></div>`);
          addLayer(m);
        }
        if (destination) {

    // ============================================================
    function InsightsPage() {
      const [insights, setInsights] = useState([]);
      const [meta, setMeta] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState('');

      const load = async () => {
        setLoading(true); setError('');
        try {
          const res = await api.getInsights();
          setInsights(res.insights); setMeta(res);
        } catch (e) { setError(e.message); }
        finally { setLoading(false); }
      };
      useEffect(() => { load(); }, []);

      if (loading) return React.createElement(Spinner);
      if (error) return React.createElement(ErrorState, { message: error, onRetry: load });

      const getCatIcon = (cat) => ({ accessibility: '📡', risk: '⚠', transport: '🚛', infrastructure: '🏭', disruption: '🚨', weather: '🌧', recommendation: '💡' }[cat] || '🤖');

      return React.createElement('div', { className: 'page-content' },
        React.createElement('div', { className: 'page-header' },
          React.createElement('div', { className: 'page-title' }, '🤖 AI Insights Engine'),
          React.createElement('div', { className: 'page-subtitle' }, `${insights.length} insights generated • Data-driven analytics • ${meta?.data_source}`)
        ),
        React.createElement('div', { style: { background: 'rgba(59,130,246,0.08)', border: '1px solid rgba(59,130,246,0.2)', borderRadius: 12, padding: '14px 20px', marginBottom: 24, fontSize: 13, color: 'var(--text-secondary)' } },
          '🤖 These insights are generated deterministically from actual backend data — routes, hubs, states, and alerts. No LLM API required. Connect ',
          React.createElement('code', { style: { background: 'var(--bg-secondary)', padding: '2px 6px', borderRadius: 4 } }, 'OPENAI_API_KEY'),
          ' environment variable to enable GPT-powered insights.'
        ),
        React.createElement('div', { className: 'insights-grid' },
          insights.map((insight, i) => React.createElement('div', { key: insight.id, className: `insight-card severity-${insight.severity}`, id: `insight-${i}` },
            React.createElement('div', { className: 'insight-meta' },
              React.createElement('span', { className: `badge badge-${insight.severity === 'critical' ? 'critical' : insight.severity === 'warning' ? 'high' : 'info'}` }, insight.severity.toUpperCase()),
              React.createElement('span', { style: { fontSize: 11, color: 'var(--text-muted)' } }, getCatIcon(insight.category) + ' ' + insight.category.toUpperCase())
            ),
            React.createElement('div', { className: 'insight-title', style: { marginTop: 10 } }, insight.title),
            React.createElement('div', { className: 'insight-text' }, insight.description),
            insight.affected_states && insight.affected_states.length > 0 && React.createElement('div', { style: { marginTop: 12, display: 'flex', gap: 6, flexWrap: 'wrap' } },
              insight.affected_states.map((s, j) => React.createElement('span', { key: j, style: { background: 'var(--bg-secondary)', borderRadius: 12, padding: '2px 10px', fontSize: 11, color: 'var(--text-secondary)' } }, s))
            )
          ))
        )
      );
    }

    // ============================================================
    // SETTINGS PAGE
    // ============================================================
    function SettingsPage() {
      const { user, setUser } = useAuth();
      const [activeTab, setActiveTab] = useState('profile');
      const [form, setForm] = useState({ full_name: user?.full_name || '', default_transport_mode: user?.default_transport_mode || 'road', default_priority: user?.default_priority || 'balanced', theme: user?.theme || 'dark', notifications_enabled: user?.notifications_enabled ?? true });
      const [saving, setSaving] = useState(false);
      const [saved, setSaved] = useState(false);

      const handleSave = async () => {
        setSaving(true); setSaved(false);
        try {
          const updated = await api.updateMe(form);
          setUser(updated); setSaved(true);
          setTimeout(() => setSaved(false), 2000);
        } catch (e) { alert('Failed to save: ' + e.message); }
        finally { setSaving(false); }
      };

      const tabs = ['profile', 'preferences', 'notifications', 'system'];

      const ToggleSwitch = ({ value, onChange }) => React.createElement('div', {
        className: `toggle ${value ? 'on' : ''}`,
        onClick: () => onChange(!value)
      });

      return React.createElement('div', { className: 'page-content' },
        React.createElement('div', { className: 'page-header' },
          React.createElement('div', { className: 'page-title' }, '⚙ Settings'),
          React.createElement('div', { className: 'page-subtitle' }, 'Platform preferences and user configuration')
        ),
        React.createElement('div', { className: 'settings-grid' },
          React.createElement('div', null,
            React.createElement('div', { className: 'card', style: { padding: '8px' } },
              tabs.map(tab => React.createElement('div', {
                key: tab, className: `settings-nav-item ${activeTab === tab ? 'active' : ''}`,
                onClick: () => setActiveTab(tab)
              }, tab.charAt(0).toUpperCase() + tab.slice(1)))
            )
          ),
          React.createElement('div', null,
            activeTab === 'profile' && React.createElement('div', { className: 'settings-section' },
              React.createElement('h3', null, 'Profile Information'),
              React.createElement('div', { style: { display: 'flex', flexDirection: 'column', gap: 16 } },
                React.createElement('div', { className: 'form-group' },
                  React.createElement('label', null, 'Full Name'),
                  React.createElement('input', { type: 'text', value: form.full_name, onChange: e => setForm({ ...form, full_name: e.target.value }) })
                ),
                React.createElement('div', { className: 'form-group' },
                  React.createElement('label', null, 'Email Address'),
                  React.createElement('input', { type: 'email', value: user?.email || '', disabled: true, style: { opacity: 0.6 } })
                ),
                React.createElement('div', { className: 'form-group' },
                  React.createElement('label', null, 'Role'),
                  React.createElement('input', { type: 'text', value: user?.role || '', disabled: true, style: { opacity: 0.6 } })
                ),
              )
            ),
            activeTab === 'preferences' && React.createElement('div', { className: 'settings-section' },
              React.createElement('h3', null, 'Route & Display Preferences'),
              React.createElement('div', { className: 'settings-row' },
                React.createElement('div', null,
                  React.createElement('div', { style: { fontWeight: 600, fontSize: 14 } }, 'Default Transport Mode'),
                  React.createElement('div', { style: { fontSize: 12, color: 'var(--text-muted)', marginTop: 2 } }, 'Pre-selected mode when planning routes')
                ),
                React.createElement('select', { value: form.default_transport_mode, onChange: e => setForm({ ...form, default_transport_mode: e.target.value }), style: { width: 140 } },
                  React.createElement('option', { value: 'road' }, 'Road'),
                  React.createElement('option', { value: 'rail' }, 'Rail'),
                  React.createElement('option', { value: 'air' }, 'Air'),
                  React.createElement('option', { value: 'multimodal' }, 'Multimodal'),
                )
              ),
              React.createElement('div', { className: 'settings-row' },
                React.createElement('div', null,
                  React.createElement('div', { style: { fontWeight: 600, fontSize: 14 } }, 'Default Route Priority'),
                  React.createElement('div', { style: { fontSize: 12, color: 'var(--text-muted)', marginTop: 2 } }, 'Default optimization priority')
                ),
                React.createElement('select', { value: form.default_priority, onChange: e => setForm({ ...form, default_priority: e.target.value }), style: { width: 160 } },
                  React.createElement('option', { value: 'balanced' }, 'Balanced'),
                  React.createElement('option', { value: 'fastest' }, 'Fastest'),
                  React.createElement('option', { value: 'cheapest' }, 'Cheapest'),
                  React.createElement('option', { value: 'safest' }, 'Safest'),
                  React.createElement('option', { value: 'most_accessible' }, 'Most Accessible'),
                )
              ),
              React.createElement('div', { className: 'settings-row' },
                React.createElement('div', null,
                  React.createElement('div', { style: { fontWeight: 600, fontSize: 14 } }, 'Theme'),
                  React.createElement('div', { style: { fontSize: 12, color: 'var(--text-muted)', marginTop: 2 } }, 'Interface color scheme')
                ),
                React.createElement('select', { value: form.theme, onChange: e => setForm({ ...form, theme: e.target.value }), style: { width: 140 } },
                  React.createElement('option', { value: 'dark' }, 'Dark (Default)'),
                  React.createElement('option', { value: 'light' }, 'Light'),
                )
              )
            ),
            activeTab === 'notifications' && React.createElement('div', { className: 'settings-section' },
              React.createElement('h3', null, 'Notification Preferences'),
              React.createElement('div', { className: 'settings-row' },
                React.createElement('div', null,
                  React.createElement('div', { style: { fontWeight: 600, fontSize: 14 } }, 'Enable Notifications'),
                  React.createElement('div', { style: { fontSize: 12, color: 'var(--text-muted)' } }, 'Receive alerts for critical disruptions')
                ),
                React.createElement(ToggleSwitch, { value: form.notifications_enabled, onChange: v => setForm({ ...form, notifications_enabled: v }) })
              ),
              ['Critical Alerts', 'Route Disruptions', 'Hub Status Changes', 'Weekly Reports'].map((label, i) => React.createElement('div', { key: i, className: 'settings-row' },
                React.createElement('div', null,
                  React.createElement('div', { style: { fontWeight: 600, fontSize: 14 } }, label),
                  React.createElement('div', { style: { fontSize: 12, color: 'var(--text-muted)' } }, 'Email + in-app')
                ),
                React.createElement(ToggleSwitch, { value: form.notifications_enabled && i < 3, onChange: () => { } })
              ))
            ),
            activeTab === 'system' && React.createElement('div', { className: 'settings-section' },
              React.createElement('h3', null, 'System Information'),
              [
                { label: 'Platform Version', value: '1.0.0' },
                { label: 'API Status', value: '🟢 Online' },
                { label: 'Data Source', value: 'Demo (Simulated NER Data)' },
                { label: 'Backend', value: 'FastAPI + SQLite' },
                { label: 'Map Provider', value: 'Leaflet + OpenStreetMap' },
                { label: 'AI Engine', value: 'Deterministic Weighted Scoring' },
              ].map((row, i) => React.createElement('div', { key: i, className: 'settings-row' },
                React.createElement('div', { style: { fontWeight: 600, fontSize: 14 } }, row.label),
                React.createElement('div', { style: { fontSize: 13, color: 'var(--text-secondary)' } }, row.value)
              ))
            ),
            React.createElement('div', { style: { marginTop: 20, display: 'flex', gap: 12 } },
              React.createElement('button', { className: 'btn btn-primary', onClick: handleSave, disabled: saving, id: 'save-settings-btn' },
                saving ? 'Saving...' : saved ? '✓ Saved!' : 'Save Changes'
              ),
              React.createElement('button', { className: 'btn btn-secondary', onClick: () => { setForm({ full_name: user?.full_name || '', default_transport_mode: user?.default_transport_mode || 'road', default_priority: user?.default_priority || 'balanced', theme: user?.theme || 'dark', notifications_enabled: user?.notifications_enabled ?? true }); } }, 'Reset')
            )
          )
        )
      );
    }

    // ============================================================
    // DASHBOARD SHELL
    // ============================================================
    function DashboardShell({ children, page }) {
      return React.createElement('div', { className: 'dashboard-layout' },
        React.createElement(Sidebar),
        React.createElement('div', { className: 'main-content' },
          React.createElement(TopBar),
          children
        )
      );
    }

    // ============================================================
    // MAIN APP ROUTER
    // ============================================================
    function App() {
      const { page, navigate } = useNav();
      const { user, loading } = useAuth();

      // Auto-login check
      useEffect(() => {
        if (!loading && !user && !['landing', 'login', 'register'].includes(page)) {
          navigate('login');
        }
      }, [user, loading, page]);

      if (loading) return React.createElement('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh' } },
        React.createElement('div', { className: 'spinner' })
      );

      const protectedPages = { dashboard: DashboardPage, routes: RoutesPage, accessibility: AccessibilityPage, hubs: HubsPage, alerts: AlertsPage, analytics: AnalyticsPage, insights: InsightsPage, settings: SettingsPage };

      if (page === 'landing') return React.createElement(LandingPage);
      if (page === 'login') return React.createElement(LoginPage);
      if (page === 'register') return React.createElement(RegisterPage);

      if (!user) { navigate('login'); return null; }

      const PageComponent = protectedPages[page] || DashboardPage;
      return React.createElement(DashboardShell, { page },
        React.createElement(PageComponent)
      );
    }

    // ============================================================
    // ROOT RENDER
    // ============================================================
    function Root() {
      return React.createElement(NavProvider, null,
        React.createElement(AuthProvider, null,
          React.createElement(App)
        )
      );
    }

    // Remove loading spinner and mount app
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('init-loading').style.display = 'none';
      const root = ReactDOM.createRoot(document.getElementById('app'));
      root.render(React.createElement(Root));
    });
  </script>
</body>

</html>
